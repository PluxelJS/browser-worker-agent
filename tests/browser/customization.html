<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Independent workspace customization</title>
		<style>
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
			}
			#root {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
				padding: 12px;
			}
			.fixture-workspace {
				height: 760px;
				min-width: 0;
			}
			@media (max-width: 700px) {
				#root {
					grid-template-columns: minmax(0, 1fr);
					padding: 4px;
				}
				.fixture-workspace {
					height: 760px;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./customization.tsx"></script>
	</body>
</html>
